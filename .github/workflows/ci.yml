name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. The pull_request event has been slow to fire on occasion —
  # PR #95 waited several minutes for a run that never appeared until the PR was
  # reopened — and without this there is no way to start CI by hand. Note a
  # dispatched run checks out the branch head, where a pull_request run checks
  # out its merge with the base.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Both Node lines app/package.json declares support for. 22.18 is the
      # release that unflagged type stripping, which the build and server rely
      # on now that ts-node is gone; 24 is the current LTS and what .nvmrc pins.
      matrix:
        node-version: ["22.18", "24"]

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` fails on a lockfile that has drifted from package.json, which
      # is the check that matters for the Dependabot PRs this repo receives.
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      # esbuild inlines this at build time and refuses to build without it. The
      # bundle is not published from CI, so a placeholder is enough to prove the
      # build works; a real key can be added as a repository secret.
      - name: Build
        run: npm run build:prod
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY || 'ci-placeholder' }}
