# Ref: https://github.com/evilmartians/lefthook
# Install the git hooks with: uvx lefthook install

pre-commit:
  commands:
    # Config in .rumdl.toml. Only staged files reach it, so gitignored paths
    # (node_modules, build output) never do; rumdl lints any path it is given.
    rumdl:
      glob: "*.md"
      run: uvx rumdl@0.2.78 check --fix {staged_files}
      stage_fixed: true
